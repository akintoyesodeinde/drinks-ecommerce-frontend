name: Frontend CI/CD — Lint, Test, Build, Docker Hub & AWS EC2 OIDC Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  NODE_VERSION: "22"
  DOCKERHUB_REPO: "akintoyesodeinde/drinks-ecommerce-frontend"
  DEFAULT_AWS_REGION: "us-east-1"
  DEFAULT_AWS_ROLE_ARN: "arn:aws:iam::415805875879:role/DrinksEcommerce-GitHubActions-Deploy"

jobs:
  build-and-test:
    name: Lint, Test & Build (React + TypeScript + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Frontend Repository
        uses: actions/checkout@v4

      - name: Verify Project Identity (Reject Foreign Project Contamination)
        run: |
          if grep -R -i "Naija""Pay" . --exclude-dir=.git --exclude-dir=node_modules; then
            echo "ERROR: Foreign project identifier detected in repository!"
            exit 1
          fi

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install Dependencies (Committed Lockfile)
        run: npm ci

      - name: Execute ESLint
        run: npm run lint

      - name: Execute Vitest Frontend Tests
        run: npm test

      - name: Build Production SPA Bundle
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '/api/v1' }}
        run: npm run build

  publish-and-deploy:
    name: Publish to Docker Hub & Deploy Frontend to AWS EC2 via OIDC + SSM
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Frontend Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Docker Hub (Dedicated Access Token)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Frontend Image (Immutable Commit SHA + latest)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || '/api/v1' }}
          tags: |
            ${{ env.DOCKERHUB_REPO }}:${{ github.sha }}
            ${{ env.DOCKERHUB_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure AWS Credentials via GitHub OIDC (No Static AWS Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN || env.DEFAULT_AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || env.DEFAULT_AWS_REGION }}
          role-session-name: GitHubActions-DrinksFrontend-${{ github.run_id }}

      - name: Verify Assumed AWS STS Identity & Account 415805875879
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query 'Account' --output text)"
          ARN="$(aws sts get-caller-identity --query 'Arn' --output text)"
          echo "Assumed Role ARN: ${ARN}"
          if [ "${ACCOUNT_ID}" != "415805875879" ]; then
            echo "ERROR: Unexpected AWS Account ID ${ACCOUNT_ID}"
            exit 1
          fi

      - name: Trigger Controlled Frontend Deployment on EC2 via AWS SSM
        env:
          IMAGE_TAG: "${{ env.DOCKERHUB_REPO }}:${{ github.sha }}"
        run: |
          set -euo pipefail
          INSTANCE_ID="$(aws ec2 describe-instances \
            --filters "Name=tag:Project,Values=DrinksEcommerce" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)"

          if [ -z "${INSTANCE_ID}" ] || [ "${INSTANCE_ID}" = "None" ]; then
            echo "ERROR: No running EC2 instance found with tag Project=DrinksEcommerce."
            exit 1
          fi
          echo "Target EC2 Instance: ${INSTANCE_ID}"

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy DrinksEcommerce Frontend ${GITHUB_SHA}" \
            --parameters "commands=[
              \"set -euo pipefail\",
              \"APP_DIR=/opt/drinks-ecommerce\",
              \"cd \${APP_DIR}\",
              \"PREV_FRONTEND_IMAGE=''\",
              \"if [ -f \${APP_DIR}/images.env ]; then source \${APP_DIR}/images.env; PREV_FRONTEND_IMAGE=\\\${FRONTEND_IMAGE:-}; fi\",
              \"BACKEND_IMAGE=\\\${BACKEND_IMAGE:-akintoyesodeinde/drinks-ecommerce-backend:latest}\",
              \"docker pull '${IMAGE_TAG}'\",
              \"printf 'BACKEND_IMAGE=%s\nFRONTEND_IMAGE=%s\n' \\\"\${BACKEND_IMAGE}\\\" '${IMAGE_TAG}' > \${APP_DIR}/images.env\",
              \"chmod 600 \${APP_DIR}/images.env\",
              \"\${APP_DIR}/scripts/sync-secrets.sh\",
              \"docker compose --env-file \${APP_DIR}/.env up -d --no-deps frontend\",
              \"HEALTHY=false\",
              \"for i in {1..20}; do if curl -fsS http://127.0.0.1:80/healthz >/dev/null 2>&1 && curl -fsS http://127.0.0.1:80/ >/dev/null 2>&1; then HEALTHY=true; break; fi; sleep 2; done\",
              \"if [ \\\"\${HEALTHY}\\\" != 'true' ]; then echo 'Frontend health check failed; rolling back'; if [ -n \\\"\${PREV_FRONTEND_IMAGE}\\\" ]; then printf 'BACKEND_IMAGE=%s\nFRONTEND_IMAGE=%s\n' \\\"\${BACKEND_IMAGE}\\\" \\\"\${PREV_FRONTEND_IMAGE}\\\" > \${APP_DIR}/images.env; \${APP_DIR}/scripts/sync-secrets.sh; docker compose --env-file \${APP_DIR}/.env up -d --no-deps frontend; fi; exit 1; fi\",
              \"echo \\\"\$(date -u +'%Y-%m-%dT%H:%M:%SZ') | FRONTEND_DEPLOY_SUCCESS | image=${IMAGE_TAG} | previous=\${PREV_FRONTEND_IMAGE:-none}\\\" >> \${APP_DIR}/releases.log\"
            ]" \
            --query "Command.CommandId" \
            --output text)"

          echo "Dispatched SSM CommandId: ${COMMAND_ID}. Polling execution status..."
          for attempt in {1..45}; do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")"

            if [ "${STATUS}" = "Success" ]; then
              echo "SSM Frontend Deployment Command Succeeded!"
              aws ssm get-command-invocation \
                --command-id "${COMMAND_ID}" \
                --instance-id "${INSTANCE_ID}" \
                --query "StandardOutputContent" \
                --output text
              exit 0
            elif [ "${STATUS}" = "Failed" ] || [ "${STATUS}" = "Cancelled" ] || [ "${STATUS}" = "TimedOut" ]; then
              echo "ERROR: SSM Frontend Deployment Command ${STATUS}!"
              aws ssm get-command-invocation \
                --command-id "${COMMAND_ID}" \
                --instance-id "${INSTANCE_ID}" \
                --query "StandardOutputContent" \
                --output text || true
              aws ssm get-command-invocation \
                --command-id "${COMMAND_ID}" \
                --instance-id "${INSTANCE_ID}" \
                --query "StandardErrorContent" \
                --output text || true
              exit 1
            fi
            sleep 6
          done

          echo "ERROR: Timed out waiting for SSM command ${COMMAND_ID}."
          exit 1
